y_threshold: 25
save_annotated_image: true

fields:
  subtotal:
    regex: 'Subtotal\s+\$?([0-9]+\.[0-9]{2})'
    group: 1
  tax:
    regex: 'VAT\s*\(\d+%\)\s+\$?([0-9]+\.[0-9]{2})'
    group: 1
  total:
    regex: 'TOTAL\s+PAID\s+\$?([0-9]+\.[0-9]{2})'
    group: 1

items_section:
  start_trigger: 'DESCRIPTION'
  end_trigger: 'Subtotal'

item_patterns:
  # Pattern 1: Complete line (Main item title + QTY + RATE + TOTAL)
  - regex: '^(?P<description>.+?)\s+(?P<quantity>\d+)\s+(?P<unit_price>\d+\.\d{2})\s+\$(?P<total_price>\d+\.\d{2})$'

  # Pattern 2: Category/Subline or Secondary Description Line
  # - regex: '^(?P<description>[A-Za-z0-9\s\-\(\)\"\/\[\]\.\:\,]+)$'