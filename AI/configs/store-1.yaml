y_threshold: 15
save_annotated_image: true

fields:
  subtotal:
    regex: 'SUBTOTAL\s+\$?([0-9]+\.[0-9]{2})'
    group: 1
  tax:
    regex: 'TAX\s*\([^)]+\)\s+([0-9]+\.[0-9]{2})'
    group: 1
  total:
    regex: 'AMOUNT\s+DUE\s+\$?([0-9]+\.[0-9]{2})'
    split_trigger: 'AMOUNT DUE'
    split_regex: '\$?([0-9]+\.[0-9]{2})'
    group: 1

items_section:
  start_trigger: 'REG:#\d+'
  end_trigger: 'SUBTOTAL'

item_patterns:
  # Pattern 1: Pricing breakdown with optional 'ea' suffix (e.g. "1@14.25 ea 14.25" or "1 @ 8.00 ea 16.00")
  - regex: '^(?P<quantity>\d+)\s*(?:[x×]|pcs|UNT)?\s*@?\s*(?P<unit_price>\d+\.\d{2})\s*(?:ea)?\s+(?P<total_price>\d+\.\d{2})$'

  # Pattern 2: Breakdown with SKU and USD prefix (e.g. "1 x 78.00 [SKU: MIC-88] USD 78.00" or "1 pcs @549.99 [SKU: UW-34G] USD549.99")
  - regex: '^(?P<quantity>\d+)\s*(?:[x×]|pcs|UNT)?\s*@?\s*(?P<unit_price>\d+\.\d{2})\s*(?:\[.*?\])?\s*(?:USD)?\s*(?P<total_price>\d+\.\d{2})$'

  # Pattern 3: Standard breakdown line (e.g. "1 UNT @34.50 34.50" or "1 pcs @54.99 54.99")
  - regex: '^(?P<quantity>\d+)\s*(?:UNT|pcs|x|×)?\s*@?\s*(?P<unit_price>\d+\.\d{2})\s+(?P<total_price>\d+\.\d{2})$'

  # Pattern 4: Description-only line (e.g. "Pop Filter Shield", "HD Web Camera 1080p", "Ultra-Wide Gaming Monitor 34\"")
  - regex: '^(?P<description>[A-Za-z0-9\s\-\(\)\"\/]+)$'